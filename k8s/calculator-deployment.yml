apiVersion: apps/v1
kind: Deployment

metadata:
  name: calculator-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: calculator

  template:
    metadata:
      labels:
        app: calculator

    spec:
      containers:
        - name: calculator
          image: karthikeyanml/calculator-app:6
          imagePullPolicy: Always

          ports:
            - containerPort: 8080